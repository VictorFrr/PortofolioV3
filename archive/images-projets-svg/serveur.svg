<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0a"/>
      <stop offset="100%" style="stop-color:#0d1a0d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg4)" rx="12"/>
  <!-- server rack -->
  <rect x="60" y="40" width="220" height="340" rx="4" fill="#111811" stroke="#1e3a1e" stroke-width="2"/>
  <text x="170" y="65" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#4a7a4a">SERVER RACK</text>
  <!-- rack units -->
  <rect x="75" y="75" width="190" height="35" rx="2" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1"/>
  <circle cx="250" cy="92" r="4" fill="#a3e635"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
  <text x="88" y="96" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">DELL PowerEdge</text>
  <rect x="75" y="118" width="190" height="35" rx="2" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1"/>
  <circle cx="250" cy="135" r="4" fill="#a3e635"><animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="88" y="139" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">HDD 1 — 2TB</text>
  <rect x="75" y="161" width="190" height="35" rx="2" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1"/>
  <circle cx="250" cy="178" r="4" fill="#a3e635"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></circle>
  <text x="88" y="182" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">HDD 2 — 2TB</text>
  <rect x="75" y="204" width="190" height="35" rx="2" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1"/>
  <circle cx="250" cy="221" r="4" fill="#febc2e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="88" y="225" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">Network Card</text>
  <!-- cables to router -->
  <line x1="280" y1="135" x2="360" y2="200" stroke="#a3e635" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="280" y1="178" x2="360" y2="210" stroke="#a3e635" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- router -->
  <rect x="360" y="165" width="120" height="60" rx="4" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1.5"/>
  <text x="420" y="190" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">ROUTER</text>
  <text x="420" y="205" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#a3e635">192.168.1.1</text>
  <!-- internet cloud -->
  <ellipse cx="600" cy="140" rx="90" ry="50" fill="#0d1a0d" stroke="#1e3a1e" stroke-width="1.5"/>
  <text x="600" y="136" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#4a7a4a">☁</text>
  <text x="600" y="155" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">Internet</text>
  <line x1="480" y1="185" x2="510" y2="160" stroke="#a3e635" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="510" y1="160" x2="510" y2="140" stroke="#a3e635" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- terminal panel -->
  <rect x="490" y="220" width="280" height="180" rx="6" fill="#0a0e0a" stroke="#1e3a1e" stroke-width="1.5"/>
  <rect x="490" y="220" width="280" height="24" rx="6" fill="#0d1a0d"/>
  <rect x="490" y="236" width="280" height="8" fill="#0d1a0d"/>
  <circle cx="508" cy="232" r="4" fill="#ff5f57"/>
  <circle cx="522" cy="232" r="4" fill="#febc2e"/>
  <circle cx="536" cy="232" r="4" fill="#28c840"/>
  <text x="630" y="236" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">root@debian-server</text>
  <text x="502" y="260" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#a3e635">$ systemctl status nginx</text>
  <text x="502" y="276" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">● nginx.service - A high performance</text>
  <text x="502" y="290" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">   Loaded: loaded</text>
  <text x="502" y="304" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#a3e635">   Active: </text><text x="560" y="304" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#28c840">active (running)</text>
  <text x="502" y="320" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">$ df -h | grep sda</text>
  <text x="502" y="336" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">/dev/sda1  4.0T  1.2T  2.8T  30%</text>
  <text x="502" y="352" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#a3e635">$ _</text>
  <rect x="516" y="340" width="6" height="12" fill="#a3e635"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
  <!-- price tag -->
  <rect x="80" y="290" width="190" height="50" rx="4" fill="#0d2a0d" stroke="#a3e635" stroke-width="1" opacity="0.7"/>
  <text x="175" y="312" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#a3e635">💰 Budget total : ~25€</text>
  <text x="175" y="330" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a7a4a">Matériel recyclé Dell</text>
</svg>
