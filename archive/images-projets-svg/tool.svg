<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00e5ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <!-- scanlines -->
  <rect width="800" height="420" fill="url(#glow)" opacity="0.03" rx="12"/>
  <!-- terminal window -->
  <rect x="40" y="30" width="720" height="360" rx="8" fill="#0a0e14" stroke="#1e2630" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="40" y="30" width="720" height="32" rx="8" fill="#111820"/>
  <rect x="40" y="50" width="720" height="12" fill="#111820"/>
  <circle cx="68" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="46" r="6" fill="#febc2e"/>
  <circle cx="108" cy="46" r="6" fill="#28c840"/>
  <text x="400" y="51" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#4a5568">eCorp Security Tool v2.5</text>
  <!-- ASCII art eCorp -->
  <text x="60" y="100" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#00e5ff" opacity="0.9">
    <tspan x="60" dy="0">  _____   ____                  </tspan>
    <tspan x="60" dy="13"> |  ___| / ___|___  _ __ _ __  </tspan>
    <tspan x="60" dy="13"> | |_   | |   / _ \| '__| '_ \ </tspan>
    <tspan x="60" dy="13"> |  _|  | |__| (_) | |  | |_) |</tspan>
    <tspan x="60" dy="13"> |_|     \____\___/|_|  | .__/ </tspan>
    <tspan x="60" dy="13">                         |_|    </tspan>
  </text>
  <!-- menu items -->
  <text x="60" y="230" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#4a5568">────────────────────────────────────</text>
  <text x="60" y="252" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#00e5ff"> [1] <tspan fill="#e2e8f0">CheckMdp</tspan>         <tspan fill="#4a5568">Password Checker</tspan></text>
  <text x="60" y="268" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#00e5ff"> [2] <tspan fill="#e2e8f0">ScanNet</tspan>           <tspan fill="#4a5568">Network Scanner</tspan></text>
  <text x="60" y="284" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#00e5ff"> [3] <tspan fill="#e2e8f0">Phishing</tspan>          <tspan fill="#4a5568">Simulation Module</tspan></text>
  <text x="60" y="300" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#00e5ff"> [4] <tspan fill="#e2e8f0">Keylogger</tspan>         <tspan fill="#4a5568">Educational Module</tspan></text>
  <text x="60" y="316" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#00e5ff"> [5] <tspan fill="#e2e8f0">IP Lookup</tspan>         <tspan fill="#4a5568">OSINT Tools</tspan></text>
  <text x="60" y="332" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#4a5568">────────────────────────────────────</text>
  <!-- prompt -->
  <text x="60" y="358" font-family="'IBM Plex Mono',monospace" font-size="12" fill="#00e5ff">$ <tspan fill="#e2e8f0">_</tspan></text>
  <!-- cursor blink rect -->
  <rect x="74" y="344" width="8" height="14" fill="#00e5ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
