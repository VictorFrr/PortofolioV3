<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0800"/>
      <stop offset="100%" style="stop-color:#1a0f00"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#abg)" rx="12"/>

  <!-- Borne d'arcade -->
  <!-- Corps principal -->
  <rect x="220" y="40" width="200" height="340" rx="8" fill="#1a1008" stroke="#3a2a10" stroke-width="2"/>
  <!-- Panneau haut arrondi -->
  <ellipse cx="320" cy="60" rx="100" ry="30" fill="#1a1008" stroke="#3a2a10" stroke-width="2"/>
  <rect x="220" y="40" width="200" height="30" fill="#1a1008"/>
  <!-- Marquee (bandeau titre) -->
  <rect x="230" y="48" width="180" height="35" rx="4" fill="#0d0800" stroke="#f97316" stroke-width="1.5"/>
  <text x="320" y="70" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#f97316" font-weight="bold">ARCADE</text>
  <!-- Ecran -->
  <rect x="240" y="95" width="160" height="120" rx="4" fill="#000" stroke="#333" stroke-width="2"/>
  <rect x="244" y="99" width="152" height="112" rx="3" fill="#001a00"/>
  <rect x="244" y="99" width="152" height="112" rx="3" fill="url(#screenGlow)"/>
  <!-- Jeu à l'écran - Pac-Man style -->
  <rect x="250" y="105" width="140" height="100" rx="2" fill="#001500"/>
  <text x="320" y="128" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#f97316">SCORE: 48200</text>
  <circle cx="285" cy="155" r="10" fill="#f97316"/>
  <path d="M285 155 L295 148 L295 162 Z" fill="#001500"/>
  <circle cx="310" cy="152" r="5" fill="#4a4aff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="325" cy="152" r="5" fill="#4a4aff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.5s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="155" r="5" fill="#ff4a4a" opacity="0.8"/>
  <text x="320" y="200" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a7a4a">INSERT COIN</text>
  <!-- Panel de contrôle -->
  <rect x="230" y="225" width="180" height="80" rx="4" fill="#111008" stroke="#2a1a00" stroke-width="1"/>
  <!-- Joystick -->
  <circle cx="275" cy="255" r="18" fill="#0d0800" stroke="#3a2a10" stroke-width="1"/>
  <circle cx="275" cy="255" r="8" fill="#f97316"/>
  <rect x="272" y="237" width="6" height="18" rx="3" fill="#888"/>
  <circle cx="275" cy="235" r="5" fill="#aaa"/>
  <!-- Boutons -->
  <circle cx="320" cy="248" r="9" fill="#ff4a4a" stroke="#cc0000" stroke-width="1"/>
  <circle cx="342" cy="248" r="9" fill="#4a4aff" stroke="#0000cc" stroke-width="1"/>
  <circle cx="320" cy="268" r="9" fill="#4aff4a" stroke="#00aa00" stroke-width="1"/>
  <circle cx="342" cy="268" r="9" fill="#ffff4a" stroke="#cccc00" stroke-width="1"/>
  <!-- Boutons brillants -->
  <circle cx="318" cy="245" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="340" cy="245" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- Coin insert -->
  <rect x="300" y="285" width="40" height="10" rx="5" fill="#0d0800" stroke="#3a2a10" stroke-width="1"/>
  <text x="320" y="293" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a4a4a">INSERT COIN</text>
  <!-- Pieds -->
  <rect x="230" y="370" width="30" height="20" rx="2" fill="#111008" stroke="#2a1a00" stroke-width="1"/>
  <rect x="380" y="370" width="30" height="20" rx="2" fill="#111008" stroke="#2a1a00" stroke-width="1"/>

  <!-- Specs panel droite -->
  <rect x="460" y="40" width="300" height="340" rx="8" fill="#111008" stroke="#2a1a00" stroke-width="1.5"/>
  <rect x="460" y="40" width="300" height="28" rx="8" fill="#1a1000"/>
  <rect x="460" y="60" width="300" height="8" fill="#1a1000"/>
  <text x="610" y="58" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#f97316">Build Specs</text>
  <!-- items -->
  <text x="475" y="90" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">🎮 CPU</text>
  <text x="530" y="90" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">Raspberry Pi 4 — 8GB</text>
  <line x1="475" y1="98" x2="748" y2="98" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="116" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">🖥 OS</text>
  <text x="530" y="116" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">RetroPie (Linux)</text>
  <line x1="475" y1="124" x2="748" y2="124" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="142" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">🕹 ROMs</text>
  <text x="530" y="142" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">Centaines — ~15 consoles</text>
  <line x1="475" y1="150" x2="748" y2="150" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="168" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">📺 Écran</text>
  <text x="530" y="168" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">Dell — récupéré</text>
  <line x1="475" y1="176" x2="748" y2="176" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="194" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">🔲 Contrôles</text>
  <text x="530" y="194" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">Kit joystick + boutons arcade</text>
  <line x1="475" y1="202" x2="748" y2="202" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="220" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f97316">🪵 Structure</text>
  <text x="530" y="220" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e2e8f0">Bois — fabriqué main</text>
  <!-- consoles list -->
  <line x1="475" y1="240" x2="748" y2="240" stroke="#2a1a00" stroke-width="1"/>
  <text x="475" y="258" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#6a4a00">CONSOLES ÉMULÉES</text>
  <text x="475" y="276" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#f97316">NES · SNES · </text>
  <text x="570" y="276" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0">Game Boy</text>
  <text x="475" y="292" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#f97316">PS1 · N64 · </text>
  <text x="555" y="292" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0">Mega Drive</text>
  <text x="475" y="308" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#f97316">GBA · Arcade · </text>
  <text x="570" y="308" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0">+ autres...</text>
  <!-- badge 100% fait main -->
  <rect x="475" y="330" width="270" height="36" rx="6" fill="#1a0f00" stroke="#f97316" stroke-width="1" opacity="0.8"/>
  <text x="610" y="353" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#f97316">✓ 100% construit à la main — De A à Z</text>
</svg>
