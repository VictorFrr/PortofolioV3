<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <radialGradient id="pcGlow" cx="35%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#e879f9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg7)" rx="12"/>
  <rect width="800" height="420" fill="url(#pcGlow)" rx="12"/>
  <!-- PC case -->
  <rect x="40" y="50" width="200" height="320" rx="8" fill="#111018" stroke="#2a1a3e" stroke-width="2"/>
  <!-- case glass panel -->
  <rect x="44" y="54" width="100" height="312" rx="6" fill="#0d0a18" stroke="#1a1030" stroke-width="1" opacity="0.7"/>
  <!-- RGB strip top -->
  <rect x="44" y="54" width="100" height="4" rx="2" fill="#e879f9" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- RGB strip bottom -->
  <rect x="44" y="362" width="100" height="4" rx="2" fill="#7b61ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <!-- GPU -->
  <rect x="52" y="200" width="180" height="60" rx="4" fill="#1a1030" stroke="#2a1a4e" stroke-width="1"/>
  <text x="75" y="225" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e879f9">RTX 4060</text>
  <text x="75" y="240" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#6a4a8a">NVIDIA GeForce</text>
  <rect x="160" y="208" width="60" height="44" rx="2" fill="#111018"/>
  <line x1="165" y1="214" x2="215" y2="214" stroke="#2a1a4e" stroke-width="1"/>
  <line x1="165" y1="222" x2="215" y2="222" stroke="#2a1a4e" stroke-width="1"/>
  <line x1="165" y1="230" x2="215" y2="230" stroke="#2a1a4e" stroke-width="1"/>
  <!-- CPU cooler -->
  <rect x="80" y="100" width="80" height="80" rx="4" fill="#1a1030" stroke="#2a1a4e" stroke-width="1"/>
  <circle cx="120" cy="140" r="28" fill="#111018" stroke="#2a1a4e" stroke-width="1"/>
  <circle cx="120" cy="140" r="20" fill="#1a1030"/>
  <circle cx="120" cy="140" r="3" fill="#e879f9"/>
  <!-- RAM sticks -->
  <rect x="52" y="160" width="15" height="35" rx="2" fill="#1a1030" stroke="#e879f9" stroke-width="0.5"/>
  <rect x="52" y="160" width="15" height="4" rx="1" fill="#e879f9" opacity="0.8"/>
  <rect x="72" y="160" width="15" height="35" rx="2" fill="#1a1030" stroke="#7b61ff" stroke-width="0.5"/>
  <rect x="72" y="160" width="15" height="4" rx="1" fill="#7b61ff" opacity="0.8"/>
  <!-- front panel -->
  <circle cx="200" cy="90" r="6" fill="#111018" stroke="#2a1a4e" stroke-width="1"/>
  <circle cx="210" cy="80" r="3" fill="#28c840"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
  <!-- specs panel -->
  <rect x="280" y="50" width="480" height="320" rx="8" fill="#111018" stroke="#2a1a3e" stroke-width="1.5"/>
  <rect x="280" y="50" width="480" height="32" rx="8" fill="#1a1030"/>
  <rect x="280" y="74" width="480" height="8" fill="#1a1030"/>
  <text x="520" y="71" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#e879f9">System Specs</text>
  <!-- spec items -->
  <line x1="295" y1="108" x2="745" y2="108" stroke="#2a1a3e" stroke-width="1"/>
  <text x="295" y="103" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">COMPONENT</text>
  <text x="530" y="103" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">DETAIL</text>
  <text x="295" y="128" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">CPU</text>
  <text x="360" y="128" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">AMD Ryzen 5 5600X</text>
  <text x="600" y="128" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">6C / 12T — 3.7GHz</text>
  <line x1="295" y1="138" x2="745" y2="138" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="156" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">GPU</text>
  <text x="360" y="156" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">NVIDIA RTX 4060</text>
  <text x="600" y="156" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">8GB GDDR6</text>
  <line x1="295" y1="166" x2="745" y2="166" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="184" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">RAM</text>
  <text x="360" y="184" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">Corsair 32GB DDR4</text>
  <text x="600" y="184" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">3200MHz — 2×16GB</text>
  <line x1="295" y1="194" x2="745" y2="194" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="212" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">SSD</text>
  <text x="360" y="212" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">500 GB NVMe</text>
  <text x="600" y="212" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">Primary drive</text>
  <line x1="295" y1="222" x2="745" y2="222" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="240" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">HDD</text>
  <text x="360" y="240" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">4 TB SATA</text>
  <text x="600" y="240" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">Storage</text>
  <line x1="295" y1="250" x2="745" y2="250" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="268" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">MOBO</text>
  <text x="360" y="268" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">Gigabyte B550M</text>
  <text x="600" y="268" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">AM4 — B550</text>
  <line x1="295" y1="278" x2="745" y2="278" stroke="#1a1030" stroke-width="1"/>
  <text x="295" y="296" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">PSU</text>
  <text x="360" y="296" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e2e8f0">650W 80+ Bronze</text>
  <text x="600" y="296" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6a4a8a">Modular</text>
  <line x1="295" y1="306" x2="745" y2="306" stroke="#1a1030" stroke-width="1"/>
  <!-- assembled badge -->
  <rect x="295" y="320" width="440" height="34" rx="4" fill="#1a1030" stroke="#e879f9" stroke-width="1" opacity="0.6"/>
  <text x="515" y="342" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#e879f9">✓ Assemblé seul — De A à Z</text>
</svg>
