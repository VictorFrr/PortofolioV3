<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)" rx="12"/>
  <rect width="800" height="420" fill="url(#chipGlow)" rx="12"/>
  <!-- PCB board -->
  <rect x="180" y="60" width="300" height="300" rx="6" fill="#1a2a1a" stroke="#2d4a2d" stroke-width="2"/>
  <!-- PCB traces -->
  <line x1="200" y1="80" x2="460" y2="80" stroke="#2d5a2d" stroke-width="1"/>
  <line x1="200" y1="340" x2="460" y2="340" stroke="#2d5a2d" stroke-width="1"/>
  <line x1="200" y1="80" x2="200" y2="340" stroke="#2d5a2d" stroke-width="1"/>
  <line x1="460" y1="80" x2="460" y2="340" stroke="#2d5a2d" stroke-width="1"/>
  <!-- ESP32 chip -->
  <rect x="260" y="155" width="140" height="110" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
  <rect x="270" y="165" width="120" height="90" rx="2" fill="#1a1a1a"/>
  <text x="330" y="215" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#7b61ff">ESP32</text>
  <text x="330" y="228" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#4a5568">WROOM-32</text>
  <!-- chip pins left -->
  <rect x="242" y="165" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="178" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="191" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="204" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="217" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="230" width="18" height="5" rx="1" fill="#888"/>
  <rect x="242" y="243" width="18" height="5" rx="1" fill="#888"/>
  <!-- chip pins right -->
  <rect x="400" y="165" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="178" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="191" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="204" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="217" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="230" width="18" height="5" rx="1" fill="#888"/>
  <rect x="400" y="243" width="18" height="5" rx="1" fill="#888"/>
  <!-- antenna -->
  <line x1="330" y1="155" x2="330" y2="80" stroke="#7b61ff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="310" y1="80" x2="350" y2="80" stroke="#7b61ff" stroke-width="2"/>
  <!-- wifi waves -->
  <path d="M 490 200 Q 520 160 490 120" stroke="#7b61ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 510 200 Q 560 145 510 90" stroke="#7b61ff" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 530 200 Q 600 130 530 60" stroke="#7b61ff" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- BT waves -->
  <path d="M 140 200 Q 110 160 140 120" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 120 200 Q 70 145 120 90" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- labels -->
  <text x="590" y="195" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#7b61ff">Wi-Fi</text>
  <text x="50" y="195" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#00e5ff">BT</text>
  <!-- LED -->
  <circle cx="430" cy="130" r="6" fill="#00e5ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="130" r="12" fill="#00e5ff" opacity="0.1">
    <animate attributeName="r" values="12;18;12" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <!-- screen -->
  <rect x="560" y="140" width="180" height="130" rx="4" fill="#0a0a0a" stroke="#333" stroke-width="1.5"/>
  <rect x="568" y="148" width="164" height="114" rx="2" fill="#001a00"/>
  <text x="650" y="172" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#00ff41">MARAUDER v0.13</text>
  <text x="650" y="188" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#4a9a4a">Networks found: 12</text>
  <text x="650" y="202" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#4a9a4a">BT devices: 5</text>
  <line x1="568" y1="215" x2="732" y2="215" stroke="#1a4a1a" stroke-width="1"/>
  <text x="650" y="232" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#00ff41">[1] Scan  [2] Sniff</text>
  <text x="650" y="248" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#4a9a4a">[3] BT    [4] More</text>
</svg>
