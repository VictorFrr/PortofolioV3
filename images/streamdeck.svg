<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d12"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#sbg)" rx="12"/>
  <!-- Boitier physique -->
  <rect x="30" y="80" width="260" height="260" rx="12" fill="#111820" stroke="#1e2d40" stroke-width="2"/>
  <rect x="30" y="80" width="260" height="32" rx="12" fill="#0d1a2e"/>
  <rect x="30" y="104" width="260" height="8" fill="#0d1a2e"/>
  <text x="160" y="102" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#22d3ee">AUDIO CONTROLLER v1</text>
  <!-- 5 potentiomètres -->
  <g>
    <!-- Pot 1 Apple Music -->
    <rect x="48" y="128" width="38" height="140" rx="5" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
    <rect x="54" y="134" width="26" height="108" rx="3" fill="#060c12"/>
    <rect x="52" y="200" width="30" height="10" rx="2" fill="#22d3ee" opacity="0.8"/>
    <line x1="67" y1="138" x2="67" y2="204" stroke="#1e2d40" stroke-width="1"/>
    <circle cx="67" cy="200" r="7" fill="#22d3ee" opacity="0.9"/>
    <text x="67" y="252" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a6080">Music</text>
    <!-- LED -->
    <circle cx="67" cy="264" r="3" fill="#22d3ee"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <!-- Pot 2 Discord -->
    <rect x="95" y="128" width="38" height="140" rx="5" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
    <rect x="101" y="134" width="26" height="108" rx="3" fill="#060c12"/>
    <rect x="99" y="185" width="30" height="10" rx="2" fill="#7b61ff" opacity="0.8"/>
    <line x1="114" y1="138" x2="114" y2="185" stroke="#1e2d40" stroke-width="1"/>
    <circle cx="114" cy="185" r="7" fill="#7b61ff" opacity="0.9"/>
    <text x="114" y="252" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a6080">Discord</text>
    <circle cx="114" cy="264" r="3" fill="#7b61ff"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <!-- Pot 3 CSGO -->
    <rect x="142" y="128" width="38" height="140" rx="5" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
    <rect x="148" y="134" width="26" height="108" rx="3" fill="#060c12"/>
    <rect x="146" y="220" width="30" height="10" rx="2" fill="#f97316" opacity="0.8"/>
    <line x1="161" y1="138" x2="161" y2="220" stroke="#1e2d40" stroke-width="1"/>
    <circle cx="161" cy="220" r="7" fill="#f97316" opacity="0.9"/>
    <text x="161" y="252" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a6080">CS:GO</text>
    <circle cx="161" cy="264" r="3" fill="#f97316"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <!-- Pot 4 Steam -->
    <rect x="189" y="128" width="38" height="140" rx="5" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
    <rect x="195" y="134" width="26" height="108" rx="3" fill="#060c12"/>
    <rect x="193" y="170" width="30" height="10" rx="2" fill="#4ade80" opacity="0.8"/>
    <line x1="208" y1="138" x2="208" y2="170" stroke="#1e2d40" stroke-width="1"/>
    <circle cx="208" cy="170" r="7" fill="#4ade80" opacity="0.9"/>
    <text x="208" y="252" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a6080">Steam</text>
    <circle cx="208" cy="264" r="3" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <!-- Pot 5 Master -->
    <rect x="236" y="128" width="38" height="140" rx="5" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
    <rect x="242" y="134" width="26" height="108" rx="3" fill="#060c12"/>
    <rect x="240" y="155" width="30" height="10" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <line x1="255" y1="138" x2="255" y2="155" stroke="#1e2d40" stroke-width="1"/>
    <circle cx="255" cy="155" r="7" fill="#e2e8f0" opacity="0.9"/>
    <text x="255" y="252" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#4a6080">Master</text>
    <circle cx="255" cy="264" r="3" fill="#e2e8f0"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ESP32 chip -->
  <rect x="55" y="280" width="220" height="44" rx="4" fill="#0a1018" stroke="#1e2d40" stroke-width="1"/>
  <rect x="65" y="286" width="80" height="32" rx="2" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="105" y="305" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#22d3ee">ESP32</text>
  <circle cx="185" cy="302" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
  <text x="200" y="306" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#4a6080">BT Connected</text>

  <!-- Bluetooth waves -->
  <path d="M 330 200 Q 360 170 330 140" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.9"/>
  <path d="M 348 210 Q 390 168 348 126" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 365 220 Q 420 165 365 110" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="380" y="240" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#22d3ee">Bluetooth</text>

  <!-- PC side -->
  <rect x="430" y="60" width="340" height="300" rx="8" fill="#111820" stroke="#1e2d40" stroke-width="1.5"/>
  <rect x="430" y="60" width="340" height="28" rx="8" fill="#0d1a2e"/>
  <rect x="430" y="80" width="340" height="8" fill="#0d1a2e"/>
  <circle cx="450" cy="74" r="5" fill="#ff5f57"/>
  <circle cx="466" cy="74" r="5" fill="#febc2e"/>
  <circle cx="482" cy="74" r="5" fill="#28c840"/>
  <text x="600" y="77" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#4a6080">audio_controller.py</text>
  <!-- Code -->
  <text x="445" y="108" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#7b61ff">import</text>
  <text x="493" y="108" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0"> bluetooth, pycaw</text>
  <text x="445" y="124" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080"># Écoute les valeurs BT</text>
  <text x="445" y="140" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#22d3ee">data</text>
  <text x="470" y="140" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0"> = bt.receive()</text>
  <text x="445" y="156" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#22d3ee">volumes</text>
  <text x="495" y="156" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0"> = parse(data)</text>
  <text x="445" y="172" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080"># Applique le volume</text>
  <text x="445" y="188" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#7b61ff">for</text>
  <text x="466" y="188" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0"> app, vol </text>
  <text x="524" y="188" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#7b61ff">in</text>
  <text x="537" y="188" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0"> volumes:</text>
  <text x="455" y="204" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0">  set_volume(app, vol)</text>
  <!-- Volume bars -->
  <line x1="445" y1="222" x2="755" y2="222" stroke="#1e2d40" stroke-width="1"/>
  <text x="445" y="238" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">LIVE VOLUMES</text>
  <!-- App volumes -->
  <text x="445" y="256" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#22d3ee">Music   </text>
  <rect x="500" y="247" width="200" height="10" rx="3" fill="#0a1018"/>
  <rect x="500" y="247" width="140" height="10" rx="3" fill="#22d3ee" opacity="0.7"/>
  <text x="708" y="256" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">70%</text>
  <text x="445" y="274" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#7b61ff">Discord </text>
  <rect x="500" y="265" width="200" height="10" rx="3" fill="#0a1018"/>
  <rect x="500" y="265" width="90" height="10" rx="3" fill="#7b61ff" opacity="0.7"/>
  <text x="708" y="274" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">45%</text>
  <text x="445" y="292" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#f97316">CS:GO   </text>
  <rect x="500" y="283" width="200" height="10" rx="3" fill="#0a1018"/>
  <rect x="500" y="283" width="160" height="10" rx="3" fill="#f97316" opacity="0.7"/>
  <text x="708" y="292" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">80%</text>
  <text x="445" y="310" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4ade80">Steam   </text>
  <rect x="500" y="301" width="200" height="10" rx="3" fill="#0a1018"/>
  <rect x="500" y="301" width="60" height="10" rx="3" fill="#4ade80" opacity="0.7"/>
  <text x="708" y="310" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">30%</text>
  <text x="445" y="328" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#e2e8f0">Master  </text>
  <rect x="500" y="319" width="200" height="10" rx="3" fill="#0a1018"/>
  <rect x="500" y="319" width="180" height="10" rx="3" fill="#e2e8f0" opacity="0.6"/>
  <text x="708" y="328" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4a6080">90%</text>
  <!-- startup -->
  <rect x="445" y="344" width="300" height="24" rx="4" fill="#0d1a0d" stroke="#4ade80" stroke-width="1" opacity="0.6"/>
  <text x="595" y="360" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#4ade80">✓ Auto-start au démarrage Windows</text>
</svg>
